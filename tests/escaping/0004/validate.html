<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../../validate.css">
    <title>Validate: Hex escape for hyphen-minus in element name</title>
  </head>
  <body>
    <div class="compare">
      <div>
        <h2>Source (unminified)</h2>
        <style>
          .source custom\2d component {
            color: red;
          }
        </style>
        <div class="source">
          <custom-component>Test element</custom-component>
        </div>
      </div>
      <div>
        <h2>Expected (minified)</h2>
        <style>
          .expected custom-component {
            color: red;
          }
        </style>
        <div class="expected">
          <custom-component>Test element</custom-component>
        </div>
      </div>
    </div>
    <p>
      Both elements above should look identical. If they differ, the
      minification is invalid.
    </p>
  </body>
</html>
