<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../../../validate.css">
    <title>Validate: calc unit canonicalization</title>
  </head>
  <body>
    <div class="compare">
      <div>
        <h2>Source (unminified)</h2>
        <style>
          .source a {
            display: block;
            width: calc(1in + 0px);
            height: 20px;
            background: #ccc;
          }
        </style>
        <div class="source">
          <a>Test element</a>
        </div>
      </div>
      <div>
        <h2>Expected (minified)</h2>
        <style>
          .expected a{display:block;width:96px;height:20px;background:#ccc}
        </style>
        <div class="expected">
          <a>Test element</a>
        </div>
      </div>
    </div>
    <p>Both boxes above should look identical. If they differ, the minification is invalid.</p>
  </body>
</html>
