<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../../../validate.css">
    <title>Selectors with escaped special characters</title>
    <style>
      .source,
      .expected {
        background: #333;
        * {
          outline: 1px solid transparent;
        }
      }
    </style>
  </head>
  <body>
    <div class="compare">
      <div>
        <h2>Source (unminified)</h2>
        <style>
          .source {
            .hover\:outline-whiteInverted\/90:hover {
              outline-color: #ffffffe6;
            }
            .hover\:outline-whiteInverted\/95:hover {
              outline-color: #fffffff2;
            }
          }
        </style>
        <div class="source">
          <div class="hover:outline-whiteInverted/90">text</div>
          <div class="hover:outline-whiteInverted/95">text</div>
        </div>
      </div>
      <div>
        <h2>Expected (minified)</h2>
        <style>
          .hover\:outline-whiteInverted\/90:hover{outline-color:#ffffffe6}.hover\:outline-whiteInverted\/95:hover{outline-color:#fffffff2}
        </style>
        <div class="expected">
          <div class="hover:outline-whiteInverted/90">text</div>
          <div class="hover:outline-whiteInverted/95">text</div>
        </div>
      </div>
    </div>
    <p>On hover, both divs will have a white outline.</p>
  </body>
</html>
