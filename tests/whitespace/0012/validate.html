<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../../../validate.css">
    <title>Validate: calc() * operator space removal</title>
    <style>
      .source,
      .expected {
        --foo: 100%;
        background: red;
        height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="compare">
      <div>
        <h2>Source (unminified)</h2>
        <style>
          .source {
            width: calc(var(--foo) * 2);
          }
        </style>
        <div style="width:50%;overflow:hidden">
          <div class="source"></div>
        </div>
      </div>
      <div>
        <h2>Expected (minified)</h2>
        <style>
          .expected{width:calc(var(--foo)*2)}
        </style>
        <div style="width:50%;overflow:hidden">
          <div class="expected"></div>
        </div>
      </div>
    </div>
    <p>Both red bars should have identical width (200% of parent, clipped to parent).</p>
  </body>
</html>
