<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../../../validate.css">
    <title>Validate: calc() + operator space preservation</title>
    <style>
      .source,
      .expected {
        height: 20px;
        background: red;
      }
    </style>
  </head>
  <body>
    <div class="compare">
      <div>
        <h2>Source (unminified)</h2>
        <style>
          .source {
            width: calc(100% + 20px);
          }
        </style>
        <div class="source"></div>
      </div>
      <div>
        <h2>Expected (minified)</h2>
        <style>
          .expected{width:calc(100% + 20px)}
        </style>
        <div class="expected"></div>
      </div>
    </div>
    <p>Both red bars above should have identical width (100% + 20px).</p>
  </body>
</html>
