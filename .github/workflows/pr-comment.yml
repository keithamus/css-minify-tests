name: PR Comment

on:
  workflow_run:
    workflows: [Test & Deploy]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to comment on
        required: true
        type: number
      run_id:
        description: workflow_run run ID from Test & Deploy (for artifact download)
        required: true
        type: number

permissions:
  pull-requests: write

jobs:
  pr-comment:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: node -v
      - run: npm -v

      - name: Download baseline results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baseline-results
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline

      - name: Download PR results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-results
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pr

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            number="$INPUT_PR"
          else
            number=$(gh api \
              "repos/${{ github.repository }}/pulls?state=all&head=$HEAD_REPO:$HEAD_BRANCH" \
              --jq '(map(select(.state == "open")) + .) | .[0].number // empty') || number=""
          fi
          case "$number" in
            '' | *[!0-9]*)
              echo "::error::No PR found for $HEAD_REPO:$HEAD_BRANCH"
              exit 1
              ;;
          esac
          echo "number=$number" >> "$GITHUB_OUTPUT"


      - name: Generate comment
        run: node scripts/pr-comment.js baseline/results.json pr/results.json > comment.md

      - name: Post or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-comment-results -->';
            const body = fs.readFileSync('comment.md', 'utf-8');
            const issue_number = parseInt('${{ steps.pr.outputs.number }}');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
